<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeRun - Join Household</title>
    <meta name="apple-itunes-app" content="app-id=YOUR_APP_ID">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .logo {
            width: 80px;
            height: 80px;
            background: #4A90D9;
            border-radius: 18px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo svg {
            width: 50px;
            height: 50px;
            fill: white;
        }
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }
        .invite-info {
            background: #f5f7fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .invite-info p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            background: #4A90D9;
            color: white;
            text-decoration: none;
            padding: 16px 40px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 217, 0.4);
        }
        .store-badge {
            margin-top: 20px;
        }
        .store-badge img {
            height: 50px;
        }
        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 12px;
        }
    </style>
    <script>
        function getUrlParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                household: params.get('household'),
                code: params.get('code')
            };
        }

        function openApp() {
            const params = getUrlParams();
            let deepLink = 'homerun://join';
            if (params.household) {
                deepLink += '?household=' + encodeURIComponent(params.household);
                if (params.code) {
                    deepLink += '&code=' + encodeURIComponent(params.code);
                }
            }
            window.location.href = deepLink;

            // Fallback to App Store after delay
            setTimeout(function() {
                window.location.href = 'https://testflight.apple.com/join/YOUR_TESTFLIGHT_CODE';
            }, 2500);
        }

        // Auto-redirect on mobile
        document.addEventListener('DOMContentLoaded', function() {
            const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
            if (isMobile) {
                openApp();
            }
        });
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </div>
        <h1>HomeRun</h1>
        <p class="subtitle">You've been invited to join a household!</p>

        <div class="invite-info">
            <p>Open this link on your iPhone to join the household in HomeRun. If you don't have the app yet, you'll be directed to download it.</p>
        </div>

        <a href="javascript:openApp()" class="btn">Open in HomeRun</a>

        <div class="store-badge">
            <a href="https://testflight.apple.com/join/YOUR_TESTFLIGHT_CODE">
                <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on TestFlight">
            </a>
        </div>

        <p class="footer">Manage your household together</p>
    </div>
</body>
</html>
